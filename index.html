<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b12" />
  <title>Equation Animator</title>
  <link rel="stylesheet" href="style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/mathjs@14.8.1/lib/browser/math.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="app-shell">
    <section class="input-panel" aria-label="Equação">
      <form id="equationForm" novalidate>
        <div class="input-row">
          <label class="sr-only" for="equationInput">Digite a equação</label>
          <input
            id="equationInput"
            name="equation"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Digite a equação"
            aria-describedby="message"
          />
          <button id="drawButton" type="submit">Desenhar</button>
        </div>

        <div id="message" class="message" role="status" aria-live="polite"></div>

        <div id="actionRow" class="action-row" hidden>
          <button id="shareButton" class="secondary-button" type="button">Compartilhar link</button>
          <button id="restartButton" class="secondary-button" type="button">Reiniciar animação</button>
        </div>
      </form>
    </section>

    <section id="graphPanel" class="graph-panel" hidden aria-label="Gráfico animado">
      <canvas id="graphCanvas"></canvas>
    </section>
  </main>
</body>
</html>
